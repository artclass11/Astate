name: Astate daily health and maintenance check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *" # 05:30 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: astate-daily-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run syntax checks
        run: npm run check
      - name: Run regression tests
        run: npm test
      - name: Export sanitized public JSON/CSV backup
        run: npm run backup:public
      - name: Retain public backup snapshot for 30 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astate-public-backup-${{ github.run_id }}
          path: backups/public-listings.*
          if-no-files-found: error
          retention-days: 30
      - name: Check public website and gateway
        run: node scripts/site-health-check.mjs
      - name: Open or update incident issue when a check fails
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          title="Astate daily health check failure"
          body="Automated daily checks failed. Review run: ${RUN_URL}. Commit: ${RUN_SHA}. This workflow reports failures; it does not make unattended production code changes."
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
