name: Astate quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install MCP package dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Matching and post-validation tests
        run: npm test
